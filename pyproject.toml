[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "diagram-restore"
version = "0.1.0"
description = "Reproducible connectivity-aware diagram restoration research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "pillow>=11,<13",
  "scipy>=1.15,<2",
  "scikit-image>=0.25,<0.27",
  "torch==2.9.0",
  "psutil>=7,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
diagram-restore = "diagram_restore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/diagram_restore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
